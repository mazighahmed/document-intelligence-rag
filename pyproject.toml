[project]
name = "docrag"
version = "0.1.0"
description = "PDF question answering with retrieval and source citations"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi==0.115.12",
    "uvicorn==0.34.2",
    "pydantic==2.11.5",
    "pydantic-settings==2.9.1",
    "python-multipart==0.0.20",
    "pypdf==5.5.0",
    "sentence-transformers==4.1.0",
    "torch==2.7.0",
    "qdrant-client==1.14.2",
    "httpx==0.28.1",
]

[dependency-groups]
dev = [
    "pytest==8.3.5",
    "ruff==0.11.12",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.uv]
required-version = "==0.7.9"
exclude-newer = "2025-06-01T00:00:00Z"

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
